name: Bug report
description: Something in ChurchKit does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not report security vulnerabilities here.** See SECURITY.md.

        Please do not include real congregant data, API keys, or Worker
        secrets in this issue. Redact before pasting logs.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [apps/api, apps/web, apps/admin, apps/mobile, packages/brand, tooling, docs]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version or commit SHA
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations: { required: true }
  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      description: Include redacted logs or error output.
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations: { required: true }
